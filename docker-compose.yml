# muckscraperHeadlinesGoogleNEW/docker-compose.yml

# app, scheduler and mcp all run the one image built from ./Dockerfile; each
# picks its own command.
x-app-image: &app-image
  build: .
  image: muckscraper-app

# Environment shared by app and scheduler. Add a new provider key here once.
x-app-env: &app-env
    FLASK_APP: aggregator.app
    SECRET_KEY: ${SECRET_KEY}
    CONFIG_ENCRYPTION_KEY: ${CONFIG_ENCRYPTION_KEY:-}
    DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_HOST: postgres
    POSTGRES_DB: ${POSTGRES_DB}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    NEWS_API_KEY: ${NEWS_API_KEY:-}
    GNEWS_API_KEY: ${GNEWS_API_KEY:-}
    NYT_API_KEY: ${NYT_API_KEY:-}
    NYT_API_DAILY_LIMIT: ${NYT_API_DAILY_LIMIT:-500}
    OLLAMA_HOST: ${OLLAMA_HOST}
    OLLAMA_FALLBACK_HOST: ${OLLAMA_FALLBACK_HOST:-}
    OLLAMA_PRIMARY_RECHECK_SECONDS: ${OLLAMA_PRIMARY_RECHECK_SECONDS:-60}
    OLLAMA_MODEL: ${OLLAMA_MODEL}
    OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-}
    OLLAMA_THINK: ${OLLAMA_THINK:-}
    EMBEDDING_MODEL: ${EMBEDDING_MODEL}
    LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
    EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
    LMSTUDIO_HOST: ${LMSTUDIO_HOST:-}
    LMSTUDIO_API_KEY: ${LMSTUDIO_API_KEY:-}
    LMSTUDIO_MODEL: ${LMSTUDIO_MODEL:-}
    LMSTUDIO_FAST_MODEL: ${LMSTUDIO_FAST_MODEL:-}
    LMSTUDIO_EMBEDDING_MODEL: ${LMSTUDIO_EMBEDDING_MODEL:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash-lite}
    GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
    LLM_FAST_PROVIDER: ${LLM_FAST_PROVIDER:-}
    GROQ_API_KEY: ${GROQ_API_KEY:-}
    GROQ_MODEL: ${GROQ_MODEL:-llama-3.1-8b-instant}
    OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    OPENROUTER_FAST_MODEL: ${OPENROUTER_FAST_MODEL:-}
    OPENROUTER_HOST: ${OPENROUTER_HOST:-https://openrouter.ai/api/v1}
    OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-}
    OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    ANTHROPIC_FAST_MODEL: ${ANTHROPIC_FAST_MODEL:-}
    ANTHROPIC_MAX_TOKENS: ${ANTHROPIC_MAX_TOKENS:-4096}
    OLLAMA_MAC: ${OLLAMA_MAC:-}
    N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
    N8N_FETCH_REPORT_WEBHOOK_URL: ${N8N_FETCH_REPORT_WEBHOOK_URL:-}
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    LANGFUSE_HOST: ${LANGFUSE_HOST:-}

services:
  postgres:
    image: pgvector/pgvector:pg14
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  # Holds the Docker socket so the admin app never has to -- exposes only
  # container-list/restart over an internal-only HTTP API. See
  # docker_restart_proxy/app.py for exactly what's reachable.
  docker-restart-proxy:
    build:
      context: ./docker_restart_proxy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  scheduler:
    <<: *app-image
    depends_on:
      postgres:
        condition: service_healthy
    command: python -m news_fetcher.scheduler
    environment:
      <<: *app-env
      BOOKMARK_STORAGE_DIR: /data/bookmarks
      # How often the Breaking News check reads the RSS feeds (headlines only).
      BREAKING_POLL_MINUTES: ${BREAKING_POLL_MINUTES:-5}
    restart: unless-stopped
    volumes:
      - .:/app
      # Bookmark time capsules (aggregator/bookmarks.py): written here,
      # served read-only by the api container.
      - bookmark_data:/data/bookmarks

  app:
    <<: *app-image
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      docker-restart-proxy:
        condition: service_started
    environment:
      <<: *app-env
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-UTC}
      PUBLIC_READ_ACCESS: ${PUBLIC_READ_ACCESS:-false}
      DOCKER_RESTART_PROXY_URL: http://docker-restart-proxy:5001
      BOOKMARK_STORAGE_DIR: /data/bookmarks
    restart: unless-stopped
    volumes:
      - .:/app
      - bookmark_data:/data/bookmarks:ro

  # Optional JSON API for the MuckScroller app and other clients (docs/API.md). Off unless
  # started with `docker compose --profile api up -d`. Its own app
  # (aggregator/api_app.py) registers only /api/v1, so this is the one port to
  # put behind a tunnel or reverse proxy; the web app stays on localhost.
  # Devices, pairing codes and API keys are managed in Settings › API.
  api:
    profiles: ["api"]
    <<: *app-image
    command: gunicorn -b 0.0.0.0:5050 -w "${API_WORKERS:-2}" --timeout 30 "aggregator.api_app:create_api_app()"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_BIND:-127.0.0.1}:${API_PORT:-5050}:5050"
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      SECRET_KEY: ${SECRET_KEY}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-UTC}
      # Reverse proxies or tunnels in front of the API; 0 when none.
      API_PROXY_HOPS: ${API_PROXY_HOPS:-1}
      API_CLIENT_IP_HEADER: ${API_CLIENT_IP_HEADER:-}
      BOOKMARK_STORAGE_DIR: /data/bookmarks
    restart: unless-stopped
    volumes:
      - .:/app:ro
      - bookmark_data:/data/bookmarks:ro

  # Optional page captures for bookmark time capsules: a PDF and screenshot
  # of each saved article's page. Off unless started with
  # `docker compose --profile capture up -d`; without it, saved stories keep
  # everything but the page captures. Its own image carries the headless
  # browser (Dockerfile.capture) and its worker runs only capture jobs.
  capture:
    profiles: ["capture"]
    build:
      context: .
      dockerfile: Dockerfile.capture
    image: muckscraper-capture
    command: python -m aggregator.capture
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *app-env
      BOOKMARK_STORAGE_DIR: /data/bookmarks
    # Chromium wants more shared memory than Docker's 64 MB default.
    shm_size: "1gb"
    restart: unless-stopped
    volumes:
      - bookmark_data:/data/bookmarks

  # Optional read-only MCP server for health checks and troubleshooting
  # (docs/MCP.md). Off unless started with `docker compose --profile mcp up -d`.
  # The checkout is mounted read-only and the database connection refuses
  # writes; container logs come from docker-restart-proxy, not the socket.
  mcp:
    profiles: ["mcp"]
    <<: *app-image
    command: python -m mcp_server
    depends_on:
      postgres:
        condition: service_healthy
      docker-restart-proxy:
        condition: service_started
    ports:
      - "${MCP_BIND:-127.0.0.1}:${MCP_PORT:-8765}:8765"
    environment:
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      OLLAMA_PROBE_LOG: ${MCP_OLLAMA_PROBE_LOG:-}
      MCP_EXPECTED_OLLAMA_CONTEXT: ${MCP_EXPECTED_OLLAMA_CONTEXT:-}
      SECRET_KEY: ${SECRET_KEY}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-UTC}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_FALLBACK_HOST: ${OLLAMA_FALLBACK_HOST:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      OLLAMA_FAST_MODEL: ${OLLAMA_FAST_MODEL:-}
      OLLAMA_THINK: ${OLLAMA_THINK:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      DOCKER_RESTART_PROXY_URL: http://docker-restart-proxy:5001
      PYTHONDONTWRITEBYTECODE: "1"
      GIT_OPTIONAL_LOCKS: "0"
    volumes:
      - .:/app:ro
    restart: unless-stopped

volumes:
  bookmark_data:

networks:
  default:
    name: app-network
