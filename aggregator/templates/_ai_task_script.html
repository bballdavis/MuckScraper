{#- startAiTask() for the story cards' summary and analysis buttons
    (ai_actions.html): starts the task, polls it with a toast (ai_toast.js,
    which the page loads) and reloads when it is done. Included inside a
    <script> by articles.html and oped.html. -#}
    const aiTaskStartUrl = "{{ url_for('admin.start_ai_task') }}";
    const aiTaskStatusTemplate = "{{ url_for('admin.ai_task_status', task_type='TASK_TYPE', resource_id=999999) }}";
    let activeAiTaskPoll = null;

    function aiTaskStatusUrl(taskType, resourceId) {
        return aiTaskStatusTemplate
            .replace('TASK_TYPE', taskType)
            .replace('999999', String(resourceId));
    }


    async function pollAiTask(taskType, resourceId, button) {
        if (activeAiTaskPoll) {
            clearInterval(activeAiTaskPoll);
            activeAiTaskPoll = null;
        }

        const statusUrl = aiTaskStatusUrl(taskType, resourceId);
        activeAiTaskPoll = setInterval(async () => {
            const response = await fetch(statusUrl);
            const status = await response.json();
            aiTaskToast(taskType, status, status.status === 'error');

            if (status.status === 'success') {
                clearInterval(activeAiTaskPoll);
                activeAiTaskPoll = null;
                window.location.reload();
                return;
            }

            if (status.status === 'error') {
                clearInterval(activeAiTaskPoll);
                activeAiTaskPoll = null;
                if (button) {
                    button.disabled = false;
                    button.classList.remove('busy');
                    if (button.dataset.originalText) button.textContent = button.dataset.originalText;
                }
            }
        }, 2000);
    }

    async function startAiTask(taskType, resourceId, button) {
        if (button) {
            button.disabled = true;
            // Icon buttons (ai_actions.html) pulse; text buttons say so.
            if (button.classList.contains('act')) button.classList.add('busy');
            else { button.dataset.originalText = button.textContent; button.textContent = 'Working...'; }
        }

        const response = await fetch(aiTaskStartUrl, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content,
            },
            body: JSON.stringify({
                task_type: taskType,
                resource_id: resourceId,
            }),
        });

        const payload = await response.json();
        aiTaskToast(taskType, payload.status || payload, response.status >= 400);

        if (!response.ok && response.status !== 409) {
            if (button) {
                button.disabled = false;
                button.classList.remove('busy');
                if (button.dataset.originalText) button.textContent = button.dataset.originalText;
            }
            return;
        }

        await pollAiTask(taskType, resourceId, button);
    }
